packages:
  - workbench/*
  - '!workbench/nitro'
  - packages/*
  - docs
  - tarballs

catalog:
  '@biomejs/biome': ^2.4.4
  '@swc/core': 1.15.3
  '@types/json-schema': ^7.0.15
  '@types/node': 22.19.0
  '@vercel/functions': ^3.4.3
  '@vercel/oidc': 3.2.0
  '@vercel/queue': 0.3.1
  '@vitest/coverage-v8': ^4.1.10
  ai: 6.0.116
  esbuild: ^0.28.1
  nitro: 3.0.260610-beta
  semver: 7.7.4
  typescript: ^6.0.3
  ulid: ~3.0.1
  undici: 7.30.0
  vitest: ^4.1.10
  zod: ~4.3.6

minimumReleaseAge: 2880

minimumReleaseAgeExclude:
  - '@turbo/*'
  - turbo
  - '@vercel/*'
  - '@workflow/*'
  - esbuild
  - '@esbuild/*'
  - '@sveltejs/load-config'
  - devalue
  # CVE-2026-102989 (GHSA-qx66-fv34-fjm8): Vercel refuses to deploy
  # @tanstack/react-start < 1.168.60. The fixed release train shipped on
  # 2026-09-30; these exact versions can be dropped once they're older
  # than the 48h gate.
  - '@tanstack/react-router@1.170.41'
  - '@tanstack/react-start@1.168.60'
  - '@tanstack/react-start-client@1.168.39'
  - '@tanstack/react-start-rsc@0.1.59'
  - '@tanstack/react-start-server@1.167.46'
  - '@tanstack/router-core@1.171.34'
  - '@tanstack/router-generator@1.167.40'
  - '@tanstack/router-plugin@1.168.42'
  - '@tanstack/start-client-core@1.170.34'
  - '@tanstack/start-plugin-core@1.171.49'
  - '@tanstack/start-server-core@1.169.39'
  - '@tanstack/start-storage-context@1.167.36'

onlyBuiltDependencies:
  - esbuild

overrides:
  rfc6902: 5.1.2
  devalue: 5.9.2
  '@sveltejs/acorn-typescript': 1.0.10
  # postcss < 8.5.18 is vulnerable to CVE-2026-45623 and GHSA-r28c-9q8g-f849
  # (arbitrary file read / .map disclosure via attacker-controlled
  # sourceMappingURL). Forces transitive pins (e.g. next.js's postcss@8.4.31)
  # onto a patched version.
  'postcss@<8.5.18': 8.5.22

savePrefix: ''
