packages:
  - workbench/*
  - "!workbench/nitro"
  - packages/*
  - docs
  - tarballs

catalog:
  "@biomejs/biome": ^2.4.4
  "@swc/core": 1.15.3
  "@types/json-schema": ^7.0.15
  "@types/node": 22.19.21
  "@vercel/functions": ^3.11.1
  "@vercel/oidc": 3.2.0
  "@vercel/queue": 0.10.0
  "@vitest/coverage-v8": ^5.1.0
  ai: 6.0.325
  enhanced-resolve: 5.26.1
  esbuild: ^0.28.2
  nitro: ^3.0.260610-beta
  semver: 7.8.6
  typescript: ^6.0.3
  ulid: ~3.0.2
  undici: 7.30.2
  vitest: ^5.1.0
  zod: ~4.6.7

catalogs:
  ai-sdk-v7:
    "@ai-sdk/openai": 4.0.110
    "@ai-sdk/react": 4.0.167
    "@ai-sdk/workflow": 2.0.95
    ai: 7.0.163

overrides:
  # `@vercel/queue` accepts any `@vercel/oidc` in the 3.x line, and 3.3+ pulls in
  # `@vercel/cli-config`, whose `xdg-app-paths` dependency instantiates itself at
  # module scope and throws `The "path" argument must be of type string` once a
  # bundler inlines it. Pin the queue client's copy to the last dependency-free
  # release so a bundled queue client keeps working.
  '@vercel/queue>@vercel/oidc': 3.2.0
  # Single @opentelemetry/api instance workspace-wide: with two resolved
  # copies (1.9.0 + 1.9.1), the copy that registers the tracer provider and
  # the copy a package imports can differ, and the API's global-registration
  # version check then hands the importer a noop tracer — world-vercel's
  # spans were silently dropped this way while core's flowed (#2900).
  '@opentelemetry/api': 1.9.1
  rfc6902: 5.1.2
  # Scoped to the 5.x line on purpose: SvelteKit, Svelte and Astro depend on
  # `devalue: ^5` and call `uneval` with string-returning replacers, which
  # devalue 6 rejects (replacers must return a `js`-tagged fragment).
  # `@workflow/core` pins 6.x itself and is left out of this override.
  'devalue@^5': 5.9.4
  '@sveltejs/acorn-typescript': 1.0.10
  # postcss < 8.5.18 is vulnerable to CVE-2026-45623 and GHSA-r28c-9q8g-f849
  # (arbitrary file read / .map disclosure via attacker-controlled
  # sourceMappingURL). Forces transitive pins (e.g. next.js's postcss@8.4.31)
  # onto a patched version.
  'postcss@<8.5.18': 8.5.32
  # Known vulnerabilities in these releases. Force transitive copies onto
  # patched releases within their existing major/minor lines.
  'undici@>=7.0.0 <7.30.1': 7.30.2
  'zod@>=4.0.0 <4.6.6': 4.6.7
  'vite@>=7.0.0 <7.3.7': 7.3.7
  'vite@>=8.0.0 <8.1.6': 8.1.6
  # Lift copies that monaco-editor and mermaid pin onto the current patch.
  'dompurify@>=3 <3.4.17': 3.4.17
  # srvx 0.11.22 only honors `X-Forwarded-Proto` behind a configured
  # `trustProxy`, which Nitro's Vercel node preset (this beta) does not pass, so
  # `request.url` turns `http://` behind Vercel's TLS termination and webhook
  # URLs built from it break. Keep Nitro's copy on 0.11.21 until Nitro sets it.
  'nitro>srvx': 0.11.21

savePrefix: ""

# Keep the lockfile single-document for tools such as Turborepo. CI installs
# the exact packageManager pin through pnpm/setup.
pmOnFail: ignore

# pnpm 11 requires Node.js 22 or newer. This replaces the two project-local
# engine-strict .npmrc files, which pnpm 11 no longer reads from repositories.
engineStrict: true

minimumReleaseAge: 2880

minimumReleaseAgeExclude:
  - '@turbo/*'
  - 'turbo'
  - '@vercel/*'
  - '@workflow/*'
  - 'esbuild'
  - '@esbuild/*'
  - '@sveltejs/load-config'
  - 'quickjs-wasi'
  - 'devalue'
  # The CI canary lanes pin `next` to a fresh canary at install time
  # (see "Setup canary" in .github/workflows/tests.yml); canaries are
  # usually younger than the 48h gate, and next and its @next/* companion
  # packages (published in lockstep) are Vercel-published.
  - 'next'
  - '@next/*'
  # CVE-2026-102989 (GHSA-qx66-fv34-fjm8): Vercel refuses to deploy
  # @tanstack/react-start < 1.168.60. The fixed release train shipped on
  # 2026-09-30; these exact versions can be dropped once they're older
  # than the 48h gate.
  - '@tanstack/react-router@1.170.41'
  - '@tanstack/react-start@1.168.60'
  - '@tanstack/react-start-client@1.168.39'
  - '@tanstack/react-start-rsc@0.1.59'
  - '@tanstack/react-start-server@1.167.46'
  - '@tanstack/router-core@1.171.34'
  - '@tanstack/router-generator@1.167.40'
  - '@tanstack/router-plugin@1.168.42'
  - '@tanstack/start-client-core@1.170.34'
  - '@tanstack/start-plugin-core@1.171.49'
  - '@tanstack/start-server-core@1.169.39'
  - '@tanstack/start-storage-context@1.167.36'
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  '@tailwindcss/oxide': false
  better-sqlite3: false
  bun: false
  cbor-extract: false
  cpu-features: false
  esbuild: true
  protobufjs: false
  sharp: false
  ssh2: false
