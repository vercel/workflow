# The main Deployment: serves the application, the probes and the backlog
# endpoints, and runs this release's workflows.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "workflow-postgres.name" . }}
  labels:
    app.kubernetes.io/name: {{ include "workflow-postgres.name" . }}
    app.kubernetes.io/component: service
    app.kubernetes.io/version: {{ include "workflow-postgres.tag" . | quote }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "workflow-postgres.name" . }}
      app.kubernetes.io/component: service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "workflow-postgres.name" . }}
        app.kubernetes.io/component: service
        # Read by pruning: the versions of live pods can still start runs.
        app.kubernetes.io/version: {{ include "workflow-postgres.tag" . | quote }}
    spec:
      serviceAccountName: {{ include "workflow-postgres.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "workflow-postgres.initContainers" . | nindent 6 }}
      containers:
        - name: {{ include "workflow-postgres.name" . }}
          {{- include "workflow-postgres.container" . | nindent 10 }}
          env:
            - name: WORKFLOW_ROLE
              value: service
            {{- include "workflow-postgres.baseEnv" . | nindent 12 }}
