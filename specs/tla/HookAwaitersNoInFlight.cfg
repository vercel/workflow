\* Ablation: fix part 1 only (share the pending awaiter, no inFlight).
\* Expected result: NoLossWhileRacing is violated -- the payload is consumed
\* into the lost race's awaiter before the next race asks for one, so that
\* race enrols a fresh awaiter nobody will settle. Part 2 is necessary.
SPECIFICATION Spec
CONSTANTS
  SharePending = TRUE
  ShareInFlight = FALSE
  Pattern = "fresh"
  NRaces = 6
  NPayloads = 5
INVARIANTS
  TypeOK
  Conservation
  InOrder
  NoLossWhileRacing
