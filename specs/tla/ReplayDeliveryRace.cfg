\* Negative result: without the barrier discipline (historical engine /
\* unordered optimistic delivery), timing decides arrival order and two
\* replays of the SAME log diverge. Expected result: TLC reports a
\* PrefixConsistency violation whose trace is the CorruptedEventLogError
\* class (a later-in-log step result overtakes an earlier wait completion
\* in one invocation but not the other).
SPECIFICATION Spec
CONSTANTS
  Schedule <- RaceSchedule
  NInv = 2
  Barriers = FALSE
  SkipMode = "direct"
INVARIANTS
  TypeOK
  ArrivalsWellFormed
  PrefixConsistency
