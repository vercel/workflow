\* The pattern the hooks docs recommend: create the hook promise once and race
\* it on every attempt. Expected result: NoLoss holds -- no payload is lost,
\* including one that arrives between races.
SPECIFICATION Spec
CONSTANTS
  SharePending = TRUE
  ShareInFlight = TRUE
  Pattern = "once"
  NRaces = 6
  NPayloads = 5
INVARIANTS
  TypeOK
  Conservation
  InOrder
  SingleAwaiter
  NoLoss
