\* The shipping dispatch discipline (entity-keyed driver messages) under
\* the documented world dedup semantics (idempotency records outlive the
\* messages they deduped). Expected result: TLC reports a SelfHealSound
\* violation -- a lost driver message's key is still burnt, the healing
\* replay's re-enqueue is silently dropped, and the run stays stuck. The
\* trace is the minimal witness that single-shot self-healing does not
\* hold under these assumptions.
SPECIFICATION Spec
CONSTANTS
  Entities <- WaitAndStep
  DedupSurvivesLoss = TRUE
  KeyMode = "entity"
  MaxAttempts = 4
INVARIANTS
  TypeOK
  SelfHealSound
