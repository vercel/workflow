\* Main theorem: under the delivery-barrier discipline, arrival order is a
\* deterministic, prefix-monotone function of the consumed log prefix under
\* adversarial scheduling and pacing -- so a suspension computed at any
\* prefix stays correct as the log grows.
\* Expected result: all invariants hold.
SPECIFICATION Spec
CONSTANTS
  Schedule <- SafeSchedule
  NInv = 2
  Barriers = TRUE
INVARIANTS
  TypeOK
  ArrivalsWellFormed
  PrefixConsistency
  Determinism
