\* HISTORICAL: the discipline before #3406 (transitive step skip) is NOT
\* prefix-consistent. The transitive skip plus idle retirement make the
\* guest-visible order of a shared prefix depend on whether a later step
\* result was in the loaded window. Expected result: TLC reports a
\* PrefixConsistency violation; the trace is the minimal reproduction of
\* the "engine class" replay divergence (live short-window trajectory vs
\* full-window replay trajectory) that #3406 fixed.
SPECIFICATION Spec
CONSTANTS
  Schedule <- SkipHazardSchedule
  NInv = 2
  Barriers = TRUE
  SkipMode = "transitive"
INVARIANTS
  TypeOK
  ArrivalsWellFormed
  PrefixConsistency
