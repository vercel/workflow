\* Falsifiability check: with the barrier discipline removed, scheduler
\* timing decides arrival order and two replays of the SAME log diverge.
\* Expected result: TLC reports a PrefixConsistency violation (the
\* CorruptedEventLogError failure mode). This guards against a vacuous
\* model and demonstrates the discipline is what discharges the invariants.
SPECIFICATION Spec
CONSTANTS
  Schedule <- RaceSchedule
  NInv = 2
  Barriers = FALSE
INVARIANTS
  TypeOK
  ArrivalsWellFormed
  PrefixConsistency
