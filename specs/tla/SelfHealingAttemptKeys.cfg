\* Alternative keying discipline: driver-message keys include the replay
\* pass ordinal, so a healing pass can always re-enqueue. Expected result:
\* SelfHealSound holds even with surviving dedup records -- at the cost of
\* the one-message-per-entity collapse the entity key provides (each pass
\* may enqueue a fresh driver for the same entity).
SPECIFICATION Spec
CONSTANTS
  Entities <- WaitAndStep
  DedupSurvivesLoss = TRUE
  KeyMode = "attempt"
  MaxAttempts = 4
INVARIANTS
  TypeOK
  SelfHealSound
