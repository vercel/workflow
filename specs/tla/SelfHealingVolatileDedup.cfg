\* Same dispatch discipline, but message loss also forgets the idempotency
\* record (a queue where prune purges dedup state). Expected result:
\* SelfHealSound holds -- self-healing is sound exactly when the dedup
\* record cannot outlive the message it deduplicates.
SPECIFICATION Spec
CONSTANTS
  Entities <- WaitAndStep
  DedupSurvivesLoss = FALSE
  KeyMode = "entity"
  MaxAttempts = 4
INVARIANTS
  TypeOK
  SelfHealSound
