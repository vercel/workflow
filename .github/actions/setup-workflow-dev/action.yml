name: 'Setup Workflow Dev Environment'
description: 'Setup Node.js, pnpm, and optionally Rust for Workflow development. Note: Checkout must be done before calling this action.'

inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '22'
  setup-rust:
    description: 'Whether to set up Rust even when package builds are disabled'
    required: false
    default: 'false'
  install-dependencies:
    description: 'Whether to install dependencies'
    required: false
    default: 'true'
  build-packages:
    description: 'Whether to build packages (excludes workbenches)'
    required: false
    default: 'true'
  cache-pnpm:
    description: 'Whether to enable the pnpm store cache. Disable for jobs that never run pnpm install (the post-job cache save fails with "Path Validation Error" when the store path was never created).'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Setup Rust
      # A full package build now includes the native SQLite World. Keep the
      # explicit input for Rust-only callers that disable package builds.
      if: ${{ inputs.setup-rust == 'true' || inputs.build-packages == 'true' }}
      uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
      with:
        toolchain: stable

    - name: Setup pnpm
      uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
      with:
        install: ${{ inputs.install-dependencies }}
        require-lockfile: ${{ inputs.install-dependencies }}
        runtime: node@${{ inputs.node-version }}
        cache: ${{ inputs.cache-pnpm }}

    - name: Build all packages
      if: ${{ inputs.build-packages == 'true' }}
      shell: bash
      run: pnpm turbo run build --filter='!./workbench/*'
