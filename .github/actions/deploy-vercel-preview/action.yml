name: Deploy a dedicated Vercel preview
description: >
  Creates an independent preview deployment of a workbench project with extra
  environment variables, for lanes that need a configuration the Git
  deployment does not have. Uses a plain `vercel deploy`, which uploads source
  and builds remotely on the same pipeline as Git deployments.

  Deliberately not `--prebuilt`: building on the runner with
  `vercel build --prebuilt` hit environment-specific bugs that do not
  reproduce on real deployments (missing `serverExternalPackages` tracing for
  `@workflow/world-vercel`, nitro preset detection picking `node-server`
  instead of `vercel`, needing the whole monorepo built on the runner).

inputs:
  project-id:
    description: Vercel project ID.
    required: true
  team-id:
    description: Vercel team ID.
    required: true
  token:
    description: Vercel token that can deploy the project.
    required: true
  env:
    description: Newline-separated KEY=VALUE environment variables for the deployment.
    required: true

outputs:
  deployment-url:
    description: The deployment's https URL.
    value: ${{ steps.deploy.outputs.url }}
  deployment-id:
    description: Deployment ID; best-effort, empty if `vercel inspect` fails.
    value: ${{ steps.deploy.outputs.deploymentId }}

runs:
  using: composite
  steps:
    # Pinned and installed once rather than `npx vercel@<version>` per command:
    # repeated `npx` resolution showed inconsistent behavior (a different Node
    # version in the CLI's banner, a doubled project path) across otherwise
    # identical CI attempts.
    - name: Install vercel CLI
      shell: bash
      run: pnpm add --global vercel@56.2.0

    - name: Deploy
      id: deploy
      shell: bash
      env:
        PROJECT_ID: ${{ inputs.project-id }}
        TEAM_ID: ${{ inputs.team-id }}
        VERCEL_DEPLOY_TOKEN: ${{ inputs.token }}
        DEPLOYMENT_ENV: ${{ inputs.env }}
      run: |
        set -euo pipefail
        # `vercel deploy` in source-upload mode applies the project's Root
        # Directory itself and expects to run from the repo root, like the Git
        # integration. `--cwd=<app dir>` would double-join the Root Directory
        # ("workbench/x/workbench/x does not exist").
        vercel pull --yes --environment=preview \
          --project="$PROJECT_ID" --scope="$TEAM_ID" --token="$VERCEL_DEPLOY_TOKEN"
        env_args=()
        while IFS= read -r line; do
          [[ -n "$line" ]] && env_args+=(-e "$line")
        done <<< "$DEPLOYMENT_ENV"
        # `vercel deploy` prints the URL to stdout and progress to stderr, so
        # do not redirect stderr into this capture. `--target=preview` is
        # explicit so these shared projects can never be deployed to their
        # production aliases by a later flag change.
        URL=$(vercel deploy --yes --target=preview "${env_args[@]}" \
          --scope="$TEAM_ID" --token="$VERCEL_DEPLOY_TOKEN")
        echo "url=$URL" >> "$GITHUB_OUTPUT"
        # Best-effort: only runtime-log capture on failure reads the ID, and it
        # skips gracefully without one.
        DEPLOYMENT_ID=$(vercel inspect "$URL" --format=json \
          --scope="$TEAM_ID" --token="$VERCEL_DEPLOY_TOKEN" 2>/dev/null \
          | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{console.log(JSON.parse(d).id||'')}catch{}})" || true)
        echo "deploymentId=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
