# Reusable workflow for running E2E tests against a community world
# Supports optional service containers (mongodb, redis) via service-type input
# Called by tests.yml with specific world configuration

name: E2E Community World

on:
  workflow_call:
    inputs:
      world-id:
        description: 'World identifier (turso, mongodb, etc.)'
        required: true
        type: string
      world-name:
        description: 'Display name for the world'
        required: true
        type: string
      world-package:
        description: 'NPM package name for the world'
        required: true
        type: string
      app-name:
        description: 'App to test (default: nextjs-turbopack)'
        required: false
        type: string
        default: 'nextjs-turbopack'
      env-vars:
        description: 'JSON object of environment variables to set'
        required: false
        type: string
        default: '{}'
      service-type:
        description: 'Service container to run (none, mongodb, redis)'
        required: false
        type: string
        default: 'none'
      setup-command:
        description: 'Setup command to run after installing the world package'
        required: false
        type: string
        default: ''

jobs:
  e2e:
    name: E2E ${{ inputs.world-name }}
    runs-on: ubuntu-latest
    # continue-on-error: community worlds are third-party packages installed
    # unpinned from npm, excluded from e2e-required-check in tests.yml, and all
    # of them are currently incompatible with the SDK at HEAD (e.g. the
    # @workflow-worlds/* packages were last published 2026-02; Turso fails with
    # "no such table: workflow_runs"). A red job here carries no signal about
    # the change under test — it only turns every run's conclusion red.
    # Failures still surface via the ⚠️ warning in the PR comment summary and
    # the uploaded result artifacts.
    continue-on-error: true
    # Successful community runs historically finish in ~12-15 min. Cap at 20 so a
    # regression can't burn 30 min; the preflight below fails much faster than this.
    timeout-minutes: 20

    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      WORKFLOW_PUBLIC_MANIFEST: '1'

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Start MongoDB
        if: ${{ inputs.service-type == 'mongodb' }}
        run: |
          docker run -d --name mongodb -p 27017:27017 mongo:7
          echo "Waiting for MongoDB to be ready..."
          for i in {1..30}; do
            if docker exec mongodb mongosh --eval 'db.runCommand({ ping: 1 })' &>/dev/null; then
              echo "MongoDB is ready"
              break
            fi
            sleep 2
          done

      - name: Start Redis
        if: ${{ inputs.service-type == 'redis' }}
        run: |
          docker run -d --name redis -p 6379:6379 redis:7-alpine
          echo "Waiting for Redis to be ready..."
          for i in {1..30}; do
            if docker exec redis redis-cli ping | grep -q PONG; then
              echo "Redis is ready"
              break
            fi
            sleep 2
          done

      - name: Setup environment
        uses: ./.github/actions/setup-workflow-dev
        with:
          build-packages: 'true'

      - name: Install ${{ inputs.world-name }} World
        run: pnpm --filter ${{ inputs.app-name }} add ${{ inputs.world-package }}

      - name: Run setup command
        if: ${{ inputs.setup-command != '' }}
        run: ${{ inputs.setup-command }}
        working-directory: workbench/${{ inputs.app-name }}

      - name: Resolve symlinks
        run: ./scripts/resolve-symlinks.sh workbench/${{ inputs.app-name }}

      # Adapters with an in-process queue worker (mongodb, redis) only dispatch
      # created runs once `getWorld().start()` has been called. The shipped
      # workbench has no instrumentation file (matches the getting-started docs,
      # #1959), so start the world here for the E2E lane only. Without this, runs
      # stay `pending` and the suite hangs until the job timeout. Worlds that
      # dispatch without an explicit start (e.g. turso) don't get this — adding it
      # changes their setup/init and is unnecessary.
      - name: Restore world kickstart (CI only)
        if: ${{ inputs.service-type == 'mongodb' || inputs.service-type == 'redis' }}
        run: cp .github/fixtures/community-world-instrumentation.ts "workbench/${{ inputs.app-name }}/instrumentation.ts"

      - name: Set environment variables
        run: |
          echo '${{ inputs.env-vars }}' | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> $GITHUB_ENV

      - name: Run E2E Tests
        run: |
          cd workbench/${{ inputs.app-name }} && pnpm dev &
          cd "$GITHUB_WORKSPACE"
          echo "Waiting for dev server to start..." && sleep 15

          # Fast-fail preflight (worlds with an in-process worker only). When such
          # a world isn't dispatching, runs stay `pending` and every test burns its
          # full timeout, so the suite would hang for the entire job timeout. Run
          # one representative set under a short wall-clock cap and bail only if it
          # *times out* (exit 124 — the hang signature). Ordinary test failures
          # don't abort; they're left to the full suite below.
          if [[ "$SERVICE_TYPE" == "mongodb" || "$SERVICE_TYPE" == "redis" ]]; then
            echo "Running community-world dispatch preflight ($WORLD_ID)..."
            rc=0
            timeout 150 pnpm vitest run packages/core/e2e/e2e.test.ts -t "addTenWorkflow" --reporter=default || rc=$?
            if [[ $rc -eq 124 ]]; then
              echo "::error::Community world '$WORLD_ID' preflight timed out — workflow runs are not being dispatched. Aborting before the job timeout."
              exit 1
            fi
            echo "Preflight finished without hanging (exit $rc); continuing to full suite."
          fi

          # Run both suites regardless of individual outcomes (so both result
          # artifacts are produced for the summary), then fail the step if either
          # suite failed. The job is non-blocking via its exclusion from
          # e2e-required-check, so this surfaces failures without gating merges.
          fail=0
          pnpm vitest run packages/core/e2e/dev.test.ts --reporter=default --reporter=json --reporter=./packages/core/e2e/github-reporter.ts --outputFile=e2e-community-${{ inputs.world-id }}-dev.json || fail=1
          sleep 10
          pnpm vitest run packages/core/e2e/e2e.test.ts --reporter=default --reporter=json --reporter=./packages/core/e2e/github-reporter.ts --outputFile=e2e-community-${{ inputs.world-id }}.json || fail=1
          exit $fail
        env:
          NODE_OPTIONS: "--enable-source-maps"
          APP_NAME: ${{ inputs.app-name }}
          SERVICE_TYPE: ${{ inputs.service-type }}
          WORLD_ID: ${{ inputs.world-id }}
          DEPLOYMENT_URL: "http://localhost:3000"
          DEV_TEST_CONFIG: '{"name":"${{ inputs.app-name }}","project":"workbench-${{ inputs.app-name }}-workflow","generatedStepPath":"app/.well-known/workflow/v1/step/route.js","generatedWorkflowPath":"app/.well-known/workflow/v1/flow/route.js","apiFilePath":"app/api/chat/route.ts","apiFileImportPath":"../../..","supportsDeferredStepCopies":false}'

      - name: Generate E2E summary
        if: always()
        run: node .github/scripts/aggregate-e2e-results.js . --job-name "E2E Tests (${{ inputs.world-name }})" >> $GITHUB_STEP_SUMMARY || true

      - name: Upload E2E results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results-community-${{ inputs.world-id }}
          path: |
            e2e-community-${{ inputs.world-id }}-dev.json
            e2e-community-${{ inputs.world-id }}.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop services
        if: always()
        run: |
          docker stop mongodb 2>/dev/null || true
          docker stop redis 2>/dev/null || true
