name: Patterns Nightly E2E

# Nightly install of every pattern from the PRODUCTION registry with an
# UNPINNED shadcn CLI — catches live-site regressions and CLI breaking
# changes without blocking PRs. Failures open/update a tracking issue.

on:
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:

jobs:
  prod-install-e2e:
    name: Production Registry Install E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "pnpm"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm turbo run build --filter='!./workbench/*' --filter='!./docs'

      - name: Install every pattern from production with latest shadcn
        env:
          SHADCN_VERSION: latest
        run: bash ./docs/scripts/install-e2e.sh https://workflow-sdk.dev

      - name: Typecheck fixture
        run: pnpm typecheck
        working-directory: workbench/install-fixture

      - name: Build fixture
        run: pnpm build
        working-directory: workbench/install-fixture

      - name: Report failure as an issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Nightly patterns install e2e failed';
            const body = [
              `The nightly production-registry install e2e failed.`,
              ``,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ``,
              `This installs every pattern from https://workflow-sdk.dev/r/* with an unpinned shadcn CLI,`,
              `then typechecks and builds the fixture app. Failures usually mean a live-site regression,`,
              `a shadcn CLI breaking change, or dependency drift.`,
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              labels: 'patterns-nightly',
            });
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issues[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title,
                body,
                labels: ['patterns-nightly'],
              });
            }
