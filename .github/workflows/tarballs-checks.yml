name: Tarballs Checks

on:
  push:
    branches:
      - main
    tags:
      - "!*"
  pull_request:

concurrency:
  # Unique group for this workflow and branch
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tarballs-preview-smoke:
    name: Tarballs Preview Smoke Checks
    runs-on: ubuntu-latest
    # `changeset-release/*` PRs are not deployed (every project's vercel.json
    # sets `git.deploymentEnabled` false for that branch, because the branch is
    # force-pushed to main's HEAD SHA and a same-SHA preview deployment
    # clobbers the per-SHA Vercel commit status), so there is no preview to
    # smoke-test. The version-bumped tarballs get this same check on the push
    # to main that follows the version PR merge.
    if: ${{ !startsWith(github.head_ref, 'changeset-release/') }}
    # Allow the resolver's 1000-second wait plus setup and endpoint checks.
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: true
          require-lockfile: true
          runtime: node@22
          cache: true

      - name: Resolve Tarballs Vercel deployment
        id: deployment
        uses: ./.github/actions/resolve-vercel-deployment
        with:
          project-id: prj_vhbMZuiy9isKtNimwWNhdRGuqla9
          token: ${{ secrets.VERCEL_LABS_TOKEN }}

      - name: Verify tarball endpoints
        # The tarballs project must be publicly accessible (no Deployment
        # Protection) so that pnpm/npm can install from preview URLs.
        # The smoke checks make unauthenticated requests and fail loudly
        # if a login redirect or non-2xx response is returned.
        run: pnpm --filter tarballs test:smoke
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.deployment-url }}
