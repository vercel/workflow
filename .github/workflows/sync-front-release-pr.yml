name: Sync Front Release PR

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: sync-front-release-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  sync-front-pr:
    name: Sync Front PR
    if: >
      startsWith(github.event.pull_request.head.ref, 'changeset-release/') &&
      github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - name: Read workflow version
        id: version
        run: |
          VERSION=$(node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('packages/workflow/package.json','utf8')); process.stdout.write(p.version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Wait for docs deployment
        id: waitForDocsDeployment
        uses: ./.github/actions/wait-for-vercel-project
        with:
          team-id: "team_nLlpyC6REAqxydlFKbrMDlud"
          project-id: "prj_aLMkVj1S4Alk08AThC76nXgwbLEB"
          vercel-token: ${{ secrets.VERCEL_DOCS_TOKEN }}
          timeout: 1200
          check-interval: 15
          environment: preview

      - name: Set branch metadata
        id: branch
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          BRANCH_NAME="workflow/release-pr-${PR_NUMBER}"
          echo "name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Checkout front repo
        uses: actions/checkout@v4
        with:
          repository: vercel/front
          token: ${{ secrets.GH_TOKEN_PULL_REQUESTS }}
          ref: main
          path: front

      - name: Update tarball deps in front package.json
        env:
          DEPLOYMENT_URL: ${{ steps.waitForDocsDeployment.outputs.deployment-url }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'front/apps/vercel-site/package.json';
          const deploymentUrl = process.env.DEPLOYMENT_URL;
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));

          pkg.dependencies = pkg.dependencies || {};
          pkg.dependencies['@workflow/core'] = `${deploymentUrl}/workflow-core.tgz`;
          pkg.dependencies['@workflow/web-shared'] = `${deploymentUrl}/workflow-web-shared.tgz`;
          pkg.dependencies['@workflow/world-vercel'] = `${deploymentUrl}/workflow-world-vercel.tgz`;

          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Commit and push to front branch
        id: commit
        working-directory: front
        env:
          BRANCH_NAME: ${{ steps.branch.outputs.name }}
        run: |
          git checkout -B "$BRANCH_NAME" origin/main
          if git diff --quiet -- apps/vercel-site/package.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/vercel-site/package.json
          git commit -m "chore(workflow): update release tarball deps"
          git push -u origin "$BRANCH_NAME" --force-with-lease
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create or update front PR
        id: front_pr
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_PULL_REQUESTS }}
          BRANCH_NAME: ${{ steps.branch.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
          DEPLOYMENT_URL: ${{ steps.waitForDocsDeployment.outputs.deployment-url }}
          WORKFLOW_PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          TITLE="[workflow] Workflow release version ${VERSION}"
          BODY=$(cat <<EOF
          Update workflow tarball dependencies in \`apps/vercel-site/package.json\`.

          Source workflow changeset PR: ${WORKFLOW_PR_URL}
          Docs deployment URL: ${DEPLOYMENT_URL}
          EOF
          )

          EXISTING=$(gh pr list \
            --repo vercel/front \
            --head "vercel:$BRANCH_NAME" \
            --state all \
            --json number,url,state \
            --jq '.[0]')

          if [ -z "$EXISTING" ] || [ "$EXISTING" = "null" ]; then
            URL=$(gh pr create \
              --repo vercel/front \
              --head "$BRANCH_NAME" \
              --base main \
              --title "$TITLE" \
              --body "$BODY")
            NUMBER=$(gh pr view "$URL" --repo vercel/front --json number --jq '.number')
            echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
            echo "url=$URL" >> "$GITHUB_OUTPUT"
          else
            NUMBER=$(echo "$EXISTING" | jq -r '.number')
            URL=$(echo "$EXISTING" | jq -r '.url')
            STATE=$(echo "$EXISTING" | jq -r '.state')
            if [ "$STATE" = "CLOSED" ]; then
              gh pr reopen "$NUMBER" --repo vercel/front
            fi
            gh pr edit "$NUMBER" \
              --repo vercel/front \
              --title "$TITLE" \
              --body "$BODY"
            echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
            echo "url=$URL" >> "$GITHUB_OUTPUT"
          fi

      - name: Link front PR back in workflow PR body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_PR_NUMBER: ${{ github.event.pull_request.number }}
          WORKFLOW_REPO: ${{ github.repository }}
          FRONT_PR_URL: ${{ steps.front_pr.outputs.url }}
        run: |
          CURRENT_BODY=$(gh pr view "$WORKFLOW_PR_NUMBER" --repo "$WORKFLOW_REPO" --json body --jq '.body')
          python - <<'PY'
          import os
          import re
          import subprocess

          workflow_pr_number = os.environ["WORKFLOW_PR_NUMBER"]
          workflow_repo = os.environ["WORKFLOW_REPO"]
          front_pr_url = os.environ["FRONT_PR_URL"]
          current = os.environ.get("CURRENT_BODY", "")

          start = "<!-- workflow-front-pr-link:start -->"
          end = "<!-- workflow-front-pr-link:end -->"
          block = f"{start}\nLinked front PR: {front_pr_url}\n{end}"

          pattern = re.compile(re.escape(start) + r".*?" + re.escape(end), re.DOTALL)
          if pattern.search(current):
            new_body = pattern.sub(block, current)
          else:
            sep = "\n\n" if current.strip() else ""
            new_body = f"{current}{sep}{block}"

          subprocess.run(
            [
              "gh",
              "pr",
              "edit",
              workflow_pr_number,
              "--repo",
              workflow_repo,
              "--body",
              new_body,
            ],
            check=True,
          )
          PY

  close-front-pr:
    name: Close Front PR
    if: >
      startsWith(github.event.pull_request.head.ref, 'changeset-release/') &&
      github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Set branch metadata
        id: branch
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          BRANCH_NAME="workflow/release-pr-${PR_NUMBER}"
          echo "name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Close linked front PR
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_PULL_REQUESTS }}
          BRANCH_NAME: ${{ steps.branch.outputs.name }}
          WORKFLOW_PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          EXISTING=$(gh pr list \
            --repo vercel/front \
            --head "vercel:$BRANCH_NAME" \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -z "$EXISTING" ] || [ "$EXISTING" = "null" ]; then
            echo "No open linked front PR found."
            exit 0
          fi

          gh pr close "$EXISTING" \
            --repo vercel/front \
            --comment "Closing because source workflow changeset PR was closed: ${WORKFLOW_PR_URL}"
