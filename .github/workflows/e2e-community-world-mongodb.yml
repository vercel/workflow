# Reusable workflow for running E2E tests against a MongoDB-based community world
# Called by tests.yml

name: E2E Community World (MongoDB)

on:
  workflow_call:
    inputs:
      world-id:
        description: 'World identifier'
        required: true
        type: string
      world-name:
        description: 'Display name for the world'
        required: true
        type: string
      world-package:
        description: 'NPM package name for the world'
        required: true
        type: string
      app-name:
        description: 'App to test (default: nextjs-turbopack)'
        required: false
        type: string
        default: 'nextjs-turbopack'
      env-vars:
        description: 'JSON object of environment variables to set'
        required: false
        type: string
        default: '{}'

jobs:
  e2e:
    name: E2E ${{ inputs.world-name }}
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.14.0

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm turbo run build --filter='!./workbench/*'

      - name: Install ${{ inputs.world-name }} World
        run: pnpm --filter ${{ inputs.app-name }} add ${{ inputs.world-package }}

      - name: Resolve symlinks
        run: ./scripts/resolve-symlinks.sh workbench/${{ inputs.app-name }}

      - name: Set environment variables
        run: |
          # Parse JSON env vars and export them
          echo '${{ inputs.env-vars }}' | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> $GITHUB_ENV

      - name: Run E2E Tests
        run: |
          cd workbench/${{ inputs.app-name }} && pnpm dev &
          echo "Waiting for dev server to start..." && sleep 15
          pnpm vitest run packages/core/e2e/dev.test.ts --reporter=json --outputFile=e2e-dev-results-${{ inputs.world-id }}.json || true
          sleep 10
          pnpm vitest run packages/core/e2e/e2e.test.ts --reporter=json --outputFile=e2e-results-${{ inputs.world-id }}.json || true
        env:
          APP_NAME: ${{ inputs.app-name }}
          DEPLOYMENT_URL: "http://localhost:3000"
          DEV_TEST_CONFIG: '{"name":"${{ inputs.app-name }}","project":"workbench-${{ inputs.app-name }}-workflow","generatedStepPath":"app/.well-known/workflow/v1/step/route.js","generatedWorkflowPath":"app/.well-known/workflow/v1/flow/route.js","apiFilePath":"app/api/chat/route.ts","apiFileImportPath":"../../.."}'

      - name: Upload E2E results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results-${{ inputs.world-id }}
          path: |
            e2e-dev-results-${{ inputs.world-id }}.json
            e2e-results-${{ inputs.world-id }}.json
