name: Tests

on:
  push:
    branches:
      - main
    tags:
      - "!*"
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  # Unique group for this workflow and branch
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci-scope:
    name: Detect CI Scope
    runs-on: ubuntu-latest
    outputs:
      fast-path: ${{ steps.scope.outputs.runtime-fast-path }}
      validation-fast-path: ${{ steps.scope.outputs.validation-fast-path }}
      e2e-vercel-slot: ${{ steps.e2e-slot.outputs.slot }}
      vercel-team-id: ${{ steps.vercel-matrix.outputs.vercel-team-id }}
      vercel-projects: ${{ steps.vercel-matrix.outputs.vercel-projects }}
      vercel-prod-matrix: ${{ steps.vercel-matrix.outputs.vercel-prod-matrix }}
      vercel-ws-transport-matrix: ${{ steps.vercel-matrix.outputs.vercel-ws-transport-matrix }}
      vercel-http-transport-matrix: ${{ steps.vercel-matrix.outputs.vercel-http-transport-matrix }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Classify changed files
        id: scope
        uses: ./.github/actions/detect-ci-scope
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Slot index for the Vercel e2e lanes' concurrency groups (see the
      # `concurrency` block on e2e-vercel-prod for what the groups do). The
      # slot count is how many runs' worth of Vercel e2e traffic may be in
      # flight repo-wide at once; everything past that queues.
      #
      # The modulo happens here because GitHub expressions have no arithmetic
      # operators, so the lanes can only read a precomputed value through
      # `needs`. Keying on run_id rather than something random keeps a re-run
      # of a run in the same slot it had, so a re-run queues behind the run it
      # replaces instead of contending with a third one.
      #
      # Tunable without a code change: set the repository variable
      # E2E_VERCEL_CONCURRENCY_SLOTS (Settings > Secrets and variables >
      # Actions > Variables). Raise it if PRs are waiting too long, lower it
      # to 1 to serialize the Vercel lanes across the whole repo.
      - name: Pick Vercel e2e concurrency slot
        id: e2e-slot
        env:
          SLOTS: ${{ vars.E2E_VERCEL_CONCURRENCY_SLOTS }}
          RUN_ID: ${{ github.run_id }}
        run: |
          slots="${SLOTS:-2}"
          case "$slots" in
            '' | *[!0-9]*) slots=2 ;;
          esac
          if [ "$slots" -lt 1 ]; then
            slots=1
          fi
          echo "slot=$((RUN_ID % slots))" >> "$GITHUB_OUTPUT"
          echo "Vercel e2e lanes use slot $((RUN_ID % slots)) of $slots"

      # CI tooling this workflow calls (local actions and scripts under
      # .github/) is read from the commit the workflow file itself came from,
      # not the PR head the jobs test, so a branch that predates a tooling
      # change still finds what the workflow calls. On `pull_request` that
      # commit is the merge commit, which the PR author already controls
      # through the workflow file, so this grants nothing the PR could not
      # already do. Do not copy it into a `pull_request_target` or
      # `workflow_run` workflow, where the workflow is trusted and the PR is
      # not.
      - name: Checkout CI tooling
        uses: actions/checkout@v4
        with:
          path: .ci
          sparse-checkout: .github
          persist-credentials: false

      # Vercel projects and per-lane matrices for the e2e-vercel-* jobs.
      - name: Build Vercel e2e matrices
        id: vercel-matrix
        run: node .ci/.github/scripts/vercel-e2e-matrix.js >> "$GITHUB_OUTPUT"

  # Phase 0: Update PR comment to show tests are running
  pr-comment-start:
    name: Create PR Comment
    runs-on: ubuntu-latest
    needs: ci-scope
    if: github.event_name == 'pull_request' && needs.ci-scope.outputs.fast-path != 'true'
    timeout-minutes: 2

    steps:
      - name: Find existing test comment
        uses: peter-evans/find-comment@3eae4d37986fb5a8592848f6a574fdf654e61f9e # v3.1.0
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- e2e-test-results -->'

      - name: Get existing comment body
        if: steps.find-comment.outputs.comment-id != ''
        id: get-comment
        uses: actions/github-script@v7
        env:
          STARTED_AT: ${{ github.run_started_at }}
        with:
          script: |
            const fs = require('fs');
            const comment = await github.rest.issues.getComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: ${{ steps.find-comment.outputs.comment-id }}
            });
            const body = comment.data.body;
            // Check if there are actual results (tables)
            if (body.includes('|') && body.includes('Passed')) {
              // Extract results section (everything after header)
              const resultsSection = body
                .replace(/<!-- e2e-test-results -->\n## 🧪 E2E Test Results\n\n> ⚠️ \*\*Results below are stale\*\*[^\n]*\n\n/g, '')
                .replace(/<!-- e2e-test-results -->\n## 🧪 E2E Test Results\n\n/g, '')
                .replace(/⏳ \*\*Tests are running\.\.\.\*\*\n\n---\n_Started at:[^_]*_\n\n---\n\n/g, '')
                .replace(/⏳ \*\*Tests are running\.\.\.\*\*\n\n---\n_Started at:[^_]*_/g, '')
                .trim();
              if (resultsSection && resultsSection.includes('|')) {
                // Write the full stale-banner message to disk and pass the
                // path to the sticky-pull-request-comment action below.
                // Inlining the previous results via `message:` blew past
                // ARG_MAX once the matrix doubled (snapshot + replay).
                const startedAt = process.env.STARTED_AT;
                const message =
                  '<!-- e2e-test-results -->\n' +
                  '## 🧪 E2E Test Results\n\n' +
                  '> ⚠️ **Results below are stale** and not from the latest commit. This comment will be updated when CI completes on the latest run.\n\n' +
                  '⏳ **Tests are running...**\n\n' +
                  '---\n' +
                  `_Started at: ${startedAt}_\n\n` +
                  '---\n\n' +
                  resultsSection +
                  '\n';
                const path = `${process.env.RUNNER_TEMP}/stale-comment.md`;
                fs.writeFileSync(path, message);
                core.setOutput('has-results', 'true');
                core.setOutput('stale-comment-path', path);
              } else {
                core.setOutput('has-results', 'false');
              }
            } else {
              core.setOutput('has-results', 'false');
            }

      - name: Create new test comment
        if: steps.find-comment.outputs.comment-id == ''
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: e2e-test-results
          message: |
            <!-- e2e-test-results -->
            ## 🧪 E2E Test Results

            ⏳ **Tests are running...**

            This comment will be updated with the results when the tests complete.

            ---
            _Started at: ${{ github.run_started_at }}_

      - name: Update existing test comment with stale warning
        if: steps.find-comment.outputs.comment-id != '' && steps.get-comment.outputs.has-results == 'true'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: e2e-test-results
          path: ${{ steps.get-comment.outputs.stale-comment-path }}

      - name: Update existing test comment without results
        if: steps.find-comment.outputs.comment-id != '' && steps.get-comment.outputs.has-results != 'true'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: e2e-test-results
          message: |
            <!-- e2e-test-results -->
            ## 🧪 E2E Test Results

            ⏳ **Tests are running...**

            This comment will be updated with the results when the tests complete.

            ---
            _Started at: ${{ github.run_started_at }}_

  unit:
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: ci-scope
    if: ${{ needs.ci-scope.outputs.validation-fast-path != 'true' && !contains(github.event.pull_request.labels.*.name, 'workflow-server-test') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup environment
        uses: ./.github/actions/setup-workflow-dev
        with:
          setup-rust: 'true'
          build-packages: 'false'

      - name: Run Unit Tests
        run: pnpm turbo test --filter='!./docs' --filter='!./workbench/vitest'

  serializable-revivers:
    name: Serializable Reviver Compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: ci-scope
    if: ${{ needs.ci-scope.outputs.validation-fast-path != 'true' && !contains(github.event.pull_request.labels.*.name, 'workflow-server-test') }}
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup environment
        uses: ./.github/actions/setup-workflow-dev
        with:
          build-packages: 'false'

      - name: Build reviver packages
        run: pnpm turbo run build --filter='@workflow/cli' --filter='@workflow/web-shared'

      - name: Check web-shared and CLI revivers
        run: pnpm vitest run packages/web-shared/test/serializable-revivers.test.ts

  build-error-messages:
    name: Node.js Module Build Errors Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: ci-scope
    if: ${{ needs.ci-scope.outputs.fast-path != 'true' && !contains(github.event.pull_request.labels.*.name, 'workflow-server-test') }}
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: true
          require-lockfile: true
          runtime: node@22
          cache: true

      - name: Run Initial Build
        run: pnpm turbo run build --filter='!./workbench/*'

      - name: Generate Workflows Registry
        run: node workbench/scripts/generate-workflows-registry.js workbench/nextjs-turbopack/workflows workbench/nextjs-turbopack/_workflows.ts

      - name: Run Build Error Tests
        run: pnpm vitest run packages/core/e2e/build-errors.test.ts
        env:
          APP_NAME: "nextjs-turbopack"

      # Regression test for the o2flow beta.26 incident: hook.resume() from a
      # plain API route must resolve the workflow world inside an isolated
      # (lambda-like) route bundle. Runs in this job because it also performs
      # a production Turbopack build of the nextjs-turbopack workbench.
      - name: Run Route Bundle Isolation Tests
        run: pnpm vitest run packages/core/e2e/route-bundle-isolation.test.ts
        env:
          APP_NAME: "nextjs-turbopack"

  vitest-plugin:
    name: Vitest Plugin Tests (${{ matrix.vm }})
    runs-on: ubuntu-latest
    needs: ci-scope
    if: ${{ needs.ci-scope.outputs.fast-path != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        # Workflow VM engines: node:vm (default) and the opt-in QuickJS
        # WASM engine (WORKFLOW_VM=quickjs).
        vm: [node, quickjs]
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-workflow-dev
        with:
          setup-rust: 'true'
          build-packages: 'false'

      - name: Build packages
        run: pnpm turbo run build --filter='!./workbench/*'

      - name: Run Vitest Plugin Tests
        run: pnpm test
        working-directory: workbench/vitest
        env:
          WORKFLOW_VM: ${{ matrix.vm }}

  e2e-package-build:
    name: Build Shared E2E Packages
    runs-on: ubuntu-latest
    needs: ci-scope
    if: ${{ needs.ci-scope.outputs.fast-path != 'true' && !contains(github.event.pull_request.labels.*.name, 'workflow-server-test') }}
    timeout-minutes: 30
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup environment and build packages
        uses: ./.github/actions/setup-workflow-dev
        with:
          build-packages: 'true'

      - name: Upload package build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: e2e-package-build-artifacts
          # Keep this list aligned with package build outputs in turbo.json.
          # upload-artifact strips the common packages/ root; consumers restore into packages/.
          path: |
            packages/*/dist
            packages/*/.well-known
            packages/*/src/version.ts
            packages/core/src/runtime/vm-serde-bundle.generated.ts
            packages/core/src/runtime/quickjs-assets.generated.ts
            packages/swc-plugin-workflow/swc_plugin_workflow.wasm
            packages/swc-plugin-workflow/build-hash.json
          include-hidden-files: true
          retention-days: 1

  e2e-vercel-prod:
    name: E2E Vercel Prod Tests (${{ matrix.app.name }} - ${{ matrix.vm }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ matrix.app.advisory }}
    needs: ci-scope
    if: ${{ needs.ci-scope.outputs.fast-path != 'true' }}
    # Repo-wide cap on how much traffic CI can point at world-vercel at once.
    #
    # The group is per (lane, matrix cell, slot), not per run, so a single
    # PR still fans its whole matrix out in parallel: within one run every
    # cell is a distinct group. What collides is the *same* cell from a
    # *different* run, which waits instead of doubling the load on the
    # backend and on the shared Vercel project this cell deploys to. With
    # the default two slots that leaves at most two runs' worth of Vercel
    # e2e in flight repo-wide, however many PRs are pushed at once.
    #
    # `queue: max` is what makes this safe to apply to a required check.
    # The default (`queue: single`) keeps one pending entry per group and
    # cancels the rest, which would turn a burst of PRs into cancelled
    # jobs and a red E2E Required Check; `max` queues up to 100 instead.
    # It cannot be combined with `cancel-in-progress: true`: GitHub
    # rejects the workflow. Superseded runs are still cancelled by the
    # workflow-level concurrency at the top of this file, which releases
    # their queued jobs too.
    concurrency:
      group: e2e-vercel-prod-${{ matrix.app.name }}-${{ matrix.vm }}-${{ needs.ci-scope.outputs.e2e-vercel-slot }}
      queue: max
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      # Projects and lane subsets live in .github/scripts/vercel-e2e-matrix.js.
      matrix: ${{ fromJSON(needs.ci-scope.outputs.vercel-prod-matrix) }}
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      WORKFLOW_PUBLIC_MANIFEST: '1'
      WORKFLOW_RETURN_VALUE_POLL_INTERVAL_MS: '5000'
      VERCEL_TEAM_ID: ${{ needs.ci-scope.outputs.vercel-team-id }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup environment
        uses: ./.github/actions/setup-workflow-dev
        with:
          build-packages: 'false'

      - name: Build CLI
        run: pnpm turbo run build --filter='@workflow/cli'

      # See "Checkout CI tooling" in the ci-scope job.
      - name: Checkout CI tooling
        uses: actions/checkout@v4
        with:
          path: .ci
          sparse-checkout: .github
          persist-credentials: false

      # Pull requests test their head commit's preview deployment and main
      # tests its production deployment. `changeset-release/*` PRs (the
      # changesets "Version Packages" PR) are deliberately not deployed: the
      # branch is force-pushed and can point at main's HEAD SHA, so every
      # project's vercel.json sets `git.deploymentEnabled` false for it. Their
      # content is main plus a version-bump commit, so the action resolves the
      # production deployment of their base commit instead.
      - name: Resolve Vercel deployment
        id: deployment
        uses: ./.ci/.github/actions/resolve-vercel-deployment
        with:
          project-id: ${{ matrix.app.project-id }}
          team-id: ${{ env.VERCEL_TEAM_ID }}
          token: ${{ secrets.VERCEL_LABS_TOKEN }}

      - name: Record E2E start time
        id: e2eStart
        run: echo "ms=$(($(date +%s) * 1000))" >> "$GITHUB_OUTPUT"

      - name: Run E2E Tests
        run: pnpm run test:e2e --reporter=verbose --reporter=json --reporter=./packages/core/e2e/github-reporter.ts "--outputFile=e2e-vercel-prod-$APP_NAME-$WORKFLOW_VM.json"
        env:
          NODE_OPTIONS: "--enable-source-maps"
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.deployment-url }}
          VERCEL_DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment-id }}
          APP_NAME: ${{ matrix.app.name }}
          WORKFLOW_VM: ${{ matrix.vm }}
          WORKFLOW_VERCEL_ENV: ${{ steps.deployment.outputs.environment }}
          WORKFLOW_VERCEL_AUTH_TOKEN: ${{ secrets.VERCEL_LABS_TOKEN }}
          WORKFLOW_VERCEL_TEAM: ${{ env.VERCEL_TEAM_ID }}
          WORKFLOW_VERCEL_PROJECT: ${{ matrix.app.project-id }}
          WORKFLOW_VERCEL_PROJECT_SLUG: ${{ matrix.app.project-slug }}
          # The trusted-sources OIDC token (x-vercel-trusted-oidc-idp-token)
          # is minted on demand inside `scripts/trusted-sources-headers.mjs`
          # via the runner's ACTIONS_ID_TOKEN_REQUEST_URL/_TOKEN env vars
          # (exposed when `permissions: id-token: write` is set on the job),
          # and re-minted before its 5-minute expiry. This lets long e2e
          # suites keep a fresh token throughout the run instead of using
          # a single pre-minted token that would expire mid-suite.
          # See: https://vercel.com/docs/deployment-protection/methods-to-bypass-deployment-protection/trusted-sources
          # Preview deployments are wired to the protected workflow-server
          # preview and production deployments to the public
          # vercel-workflow.com server; the harness has to read run state
          # from the same server the app writes it to.
          VERCEL_WORKFLOW_SERVER_URL: ${{ steps.deployment.outputs.environment == 'preview' && secrets.VERCEL_WORKFLOW_SERVER_URL || '' }}

      - name: Report E2E results
        if: always()
        uses: ./.ci/.github/actions/report-vercel-e2e
        with:
          results-name: vercel-prod-${{ matrix.app.name }}-${{ matrix.vm }}
          app: ${{ matrix.app.name }}
          summary-title: E2E Vercel Prod (${{ matrix.app.name }} - ${{ matrix.vm }})
          capture-runtime-logs: ${{ job.status == 'failure' }}
          deployment-id: ${{ steps.deployment.outputs.deployment-id }}
          environment: ${{ steps.deployment.outputs.environment }}
          project-id: ${{ matrix.app.project-id }}
          team-id: ${{ env.VERCEL_TEAM_ID }}
          token: ${{ secrets.VERCEL_LABS_TOKEN }}
          e2e-start-ms: ${{ steps.e2eStart.outputs.ms }}

  e2e-vercel-multi-region:
    # Vercel-specific multi-region routing suite (start()'s `region`
    # option). Deliberately separate from e2e-vercel-prod: that job runs
    # the shared suite as a matrix across all worlds/frameworks, while
    # this functionality only exists for @workflow/world-vercel and only
    # the nextjs-turbopack workbench is deployed multi-region
    # (workbench/nextjs-turbopack/vercel.json pins iad1+sfo1+fra1).
    name: E2E Vercel Multi-Region Tests (nextjs-turbopack)
    runs-on: ubuntu-latest
    # 19 regions: the implicit-route cases pay one cold start each,
    # sequentially.
    timeout-minutes: 35
    needs: ci-scope
    if: ${{ needs.ci-scope.outputs.fast-path != 'true' }}
    # One cell, so one group per slot. See e2e-vercel-prod's block above.
    concurrency:
      group: e2e-vercel-multi-region-${{ needs.ci-scope.outputs.e2e-vercel-slot }}
      queue: max
    permissions:
      id-token: write
      contents: read
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      WORKFLOW_PUBLIC_MANIFEST: '1'
      WORKFLOW_RETURN_VALUE_POLL_INTERVAL_MS: '5000'
      VERCEL_TEAM_ID: ${{ needs.ci-scope.outputs.vercel-team-id }}
      VERCEL_PROJECT_ID: ${{ fromJSON(needs.ci-scope.outputs.vercel-projects)['nextjs-turbopack']['project-id'] }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup environment
        uses: ./.github/actions/setup-workflow-dev
        with:
          build-packages: 'false'

      - name: Build CLI
        run: pnpm turbo run build --filter='@workflow/cli'

      # See "Checkout CI tooling" in the ci-scope job.
      - name: Checkout CI tooling
        uses: actions/checkout@v4
        with:
          path: .ci
          sparse-checkout: .github
          persist-credentials: false

      # See the note on e2e-vercel-prod's deployment step.
      - name: Resolve Vercel deployment
        id: deployment
        uses: ./.ci/.github/actions/resolve-vercel-deployment
        with:
          project-id: ${{ env.VERCEL_PROJECT_ID }}
          team-id: ${{ env.VERCEL_TEAM_ID }}
          token: ${{ secrets.VERCEL_LABS_TOKEN }}

      - name: Record E2E start time
        id: e2eStart
        run: echo "ms=$(($(date +%s) * 1000))" >> "$GITHUB_OUTPUT"

      - name: Run Multi-Region E2E Tests
        run: pnpm vitest run packages/core/e2e/e2e-region.test.ts --reporter=verbose --reporter=json --reporter=./packages/core/e2e/github-reporter.ts "--outputFile=e2e-vercel-multi-region-$APP_NAME.json"
        env:
          NODE_OPTIONS: "--enable-source-maps"
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.deployment-url }}
          VERCEL_DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment-id }}
          APP_NAME: nextjs-turbopack
          WORKFLOW_VERCEL_ENV: ${{ steps.deployment.outputs.environment }}
          WORKFLOW_VERCEL_AUTH_TOKEN: ${{ secrets.VERCEL_LABS_TOKEN }}
          WORKFLOW_VERCEL_TEAM: ${{ env.VERCEL_TEAM_ID }}
          WORKFLOW_VERCEL_PROJECT: ${{ env.VERCEL_PROJECT_ID }}
          WORKFLOW_VERCEL_PROJECT_SLUG: ${{ fromJSON(needs.ci-scope.outputs.vercel-projects)['nextjs-turbopack']['project-slug'] }}
          # See the note on e2e-vercel-prod.
          VERCEL_WORKFLOW_SERVER_URL: ${{ steps.deployment.outputs.environment == 'preview' && secrets.VERCEL_WORKFLOW_SERVER_URL || '' }}

      - name: Report E2E results
        if: always()
        uses: ./.ci/.github/actions/report-vercel-e2e
        with:
          results-name: vercel-multi-region-nextjs-turbopack
          app: nextjs-turbopack
          summary-title: E2E Vercel Multi-Region (nextjs-turbopack)
          capture-runtime-logs: ${{ job.status == 'failure' }}
          deployment-id: ${{ steps.deployment.outputs.deployment-id }}
          environment: ${{ steps.deployment.outputs.environment }}
          project-id: ${{ env.VERCEL_PROJECT_ID }}
          team-id: ${{ env.VERCEL_TEAM_ID }}
          token: ${{ secrets.VERCEL_LABS_TOKEN }}
          e2e-start-ms: ${{ steps.e2eStart.outputs.ms }}

  e2e-vercel-ws-transport:
    # Dedicated coverage for world-vercel's WebSocket events transport
    # (WORKFLOW_EVENTS_TRANSPORT=ws — see events-v4.ts's
    # isWsEventsTransportEnabled). Every other Vercel lane inherits the
    # default transport but checks nothing; this is the only lane that
    # *asserts* the socket carried the events. See
    # e2e-vercel-http-transport below for the other side.
    #
    # Runs the full e2e suite against its own `vercel deploy` rather than the
    # Git deployment: that is the only way to get a second, independent
    # deployment of a project with its own env var, without creating a whole
    # new project.
    name: E2E Vercel WS Transport Test (${{ matrix.app.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: ci-scope
    if: ${{ needs.ci-scope.outputs.fast-path != 'true' }}
    # See e2e-vercel-prod's block above. This lane's cells are worth capping
    # for a second reason: each one is a full remote `vercel deploy`, so a
    # burst of PRs also queues builds on the shared project.
    concurrency:
      group: e2e-vercel-ws-transport-${{ matrix.app.name }}-${{ needs.ci-scope.outputs.e2e-vercel-slot }}
      queue: max
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.ci-scope.outputs.vercel-ws-transport-matrix) }}
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      WORKFLOW_PUBLIC_MANIFEST: '1'
      VERCEL_TEAM_ID: ${{ needs.ci-scope.outputs.vercel-team-id }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup environment
        uses: ./.github/actions/setup-workflow-dev
        with:
          build-packages: 'false'

      - name: Build CLI
        run: pnpm turbo run build --filter='@workflow/cli'

      # See "Checkout CI tooling" in the ci-scope job.
      - name: Checkout CI tooling
        uses: actions/checkout@v4
        with:
          path: .ci
          sparse-checkout: .github
          persist-credentials: false

      # Strict mode turns a silent HTTP demotion into a failed run, so this
      # lane asserts the socket carried traffic instead of only asserting the
      # feature was harmless. Scoped to `step_completed`; see
      # STRICT_WS_EVENT_TYPES in events-v4.ts for why other event types fall
      # back legitimately. Never set on e2e-vercel-prod.
      - name: Deploy a dedicated WS-transport preview
        id: deployment
        uses: ./.ci/.github/actions/deploy-vercel-preview
        with:
          project-id: ${{ matrix.app.project-id }}
          team-id: ${{ env.VERCEL_TEAM_ID }}
          token: ${{ secrets.VERCEL_LABS_TOKEN }}
          env: |
            WORKFLOW_EVENTS_TRANSPORT=ws
            WORKFLOW_INTERNAL_EVENTS_TRANSPORT_STRICT=1

      - name: Record E2E start time
        id: e2eStart
        run: echo "ms=$(($(date +%s) * 1000))" >> "$GITHUB_OUTPUT"

      - name: Run E2E Tests
        run: pnpm run test:e2e --reporter=verbose --reporter=json --reporter=./packages/core/e2e/github-reporter.ts "--outputFile=e2e-vercel-ws-transport-$APP_NAME.json"
        env:
          NODE_OPTIONS: "--enable-source-maps"
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.deployment-url }}
          VERCEL_DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment-id }}
          APP_NAME: ${{ matrix.app.name }}
          WORKFLOW_VERCEL_ENV: "preview"
          WORKFLOW_VERCEL_AUTH_TOKEN: ${{ secrets.VERCEL_LABS_TOKEN }}
          WORKFLOW_VERCEL_TEAM: ${{ env.VERCEL_TEAM_ID }}
          WORKFLOW_VERCEL_PROJECT: ${{ matrix.app.project-id }}
          WORKFLOW_VERCEL_PROJECT_SLUG: ${{ matrix.app.project-slug }}
          VERCEL_WORKFLOW_SERVER_URL: ${{ github.ref != 'refs/heads/main' && secrets.VERCEL_WORKFLOW_SERVER_URL || '' }}

      - name: Report E2E results
        if: always()
        uses: ./.ci/.github/actions/report-vercel-e2e
        with:
          results-name: vercel-ws-transport-${{ matrix.app.name }}
          app: ${{ matrix.app.name }}
          summary-title: E2E Vercel WS Transport (${{ matrix.app.name }})
          capture-runtime-logs: ${{ job.status == 'failure' }}
          deployment-id: ${{ steps.deployment.outputs.deployment-id }}
          environment: preview
          project-id: ${{ matrix.app.project-id }}
          team-id: ${{ env.VERCEL_TEAM_ID }}
          token: ${{ secrets.VERCEL_LABS_TOKEN }}
          e2e-start-ms: ${{ steps.e2eStart.outputs.ms }}

  e2e-vercel-http-transport:
    # The counterpart to e2e-vercel-ws-transport. With
    # WORKFLOW_EVENTS_TRANSPORT defaulting to `ws`, e2e-vercel-prod — which
    # sets no transport env var at all — is a WebSocket lane, so nothing else
    # exercises the HTTP events transport against a real Vercel deployment.
    #
    # HTTP is the fallback path, and the fallback is *silent*:
    # resolveWsTransport returning null costs a write nothing and logs
    # nothing. A path that is both unexercised and quiet is the exact
    # shape of the durabench bug this lane came out of, so it is
    # unconditional and required.
    #
    # Six apps, chosen by server shape rather than by count; each row is a
    # real `vercel deploy` charged to every PR, so the full 14 is too
    # expensive, but two was too thin for a transport that is still
    # supported. The shapes, one fixture each:
    #   example          - baseline, no framework server
    #   nextjs-turbopack - Next; also the only fixture emitting OTEL spans,
    #                      so the only one that can show which transport ran
    #   vite             - Vite SSR
    #   express          - Node req/res server
    #   nitro            - Nitro/h3, which also covers nuxt
    #   hono             - fetch-API Request/Response server, a genuinely
    #                      different mount shape from express
    #
    # Omitted because they duplicate a shape already here: nextjs-webpack
    # (same runtime as turbopack, different bundler), nuxt (nitro), fastify
    # and nest (both express-shaped), astro and tanstack-start (adapter
    # variants). `python` is omitted because it has no conformance gate and
    # needs routes this suite does not serve - see the e2e-python job.
    name: E2E Vercel HTTP Transport Test (${{ matrix.app.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: ci-scope
    if: ${{ needs.ci-scope.outputs.fast-path != 'true' }}
    # See e2e-vercel-prod and e2e-vercel-ws-transport above.
    concurrency:
      group: e2e-vercel-http-transport-${{ matrix.app.name }}-${{ needs.ci-scope.outputs.e2e-vercel-slot }}
      queue: max
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.ci-scope.outputs.vercel-http-transport-matrix) }}
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      WORKFLOW_PUBLIC_MANIFEST: '1'
      VERCEL_TEAM_ID: ${{ needs.ci-scope.outputs.vercel-team-id }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup environment
        uses: ./.github/actions/setup-workflow-dev
        with:
          build-packages: 'false'

      - name: Build CLI
        run: pnpm turbo run build --filter='@workflow/cli'

      # See "Checkout CI tooling" in the ci-scope job.
      - name: Checkout CI tooling
        uses: actions/checkout@v4
        with:
          path: .ci
          sparse-checkout: .github
          persist-credentials: false

      # `http` is the one value that opts out; the gate compares against
      # exactly this string, so a typo here would silently test the default
      # instead of the fallback and this lane would quietly become a
      # duplicate of e2e-vercel-prod.
      - name: Deploy a dedicated HTTP-transport preview
        id: deployment
        uses: ./.ci/.github/actions/deploy-vercel-preview
        with:
          project-id: ${{ matrix.app.project-id }}
          team-id: ${{ env.VERCEL_TEAM_ID }}
          token: ${{ secrets.VERCEL_LABS_TOKEN }}
          env: |
            WORKFLOW_EVENTS_TRANSPORT=http

      - name: Record E2E start time
        id: e2eStart
        run: echo "ms=$(($(date +%s) * 1000))" >> "$GITHUB_OUTPUT"

      - name: Run E2E Tests
        run: pnpm run test:e2e --reporter=verbose --reporter=json --reporter=./packages/core/e2e/github-reporter.ts "--outputFile=e2e-vercel-http-transport-$APP_NAME.json"
        env:
          NODE_OPTIONS: "--enable-source-maps"
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.deployment-url }}
          VERCEL_DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment-id }}
          APP_NAME: ${{ matrix.app.name }}
          WORKFLOW_VERCEL_ENV: "preview"
          WORKFLOW_VERCEL_AUTH_TOKEN: ${{ secrets.VERCEL_LABS_TOKEN }}
          WORKFLOW_VERCEL_TEAM: ${{ env.VERCEL_TEAM_ID }}
          WORKFLOW_VERCEL_PROJECT: ${{ matrix.app.project-id }}
          WORKFLOW_VERCEL_PROJECT_SLUG: ${{ matrix.app.project-slug }}
          VERCEL_WORKFLOW_SERVER_URL: ${{ github.ref != 'refs/heads/main' && secrets.VERCEL_WORKFLOW_SERVER_URL || '' }}

      - name: Report E2E results
        if: always()
        uses: ./.ci/.github/actions/report-vercel-e2e
        with:
          results-name: vercel-http-transport-${{ matrix.app.name }}
          app: ${{ matrix.app.name }}
          summary-title: E2E Vercel HTTP Transport (${{ matrix.app.name }})
          capture-runtime-logs: ${{ job.status == 'failure' }}
          deployment-id: ${{ steps.deployment.outputs.deployment-id }}
          environment: preview
          project-id: ${{ matrix.app.project-id }}
          team-id: ${{ env.VERCEL_TEAM_ID }}
          token: ${{ secrets.VERCEL_LABS_TOKEN }}
          e2e-start-ms: ${{ steps.e2eStart.outputs.ms }}

  getTestMatrix:
    name: Get Test Matrix
    runs-on: ubuntu-latest
    needs: ci-scope
    if: ${{ needs.ci-scope.outputs.fast-path != 'true' && !contains(github.event.pull_request.labels.*.name, 'workflow-server-test') }}
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup environment
        uses: ./.github/actions/setup-workflow-dev
        with:
          install-dependencies: 'false'
          build-packages: 'false'
          cache-pnpm: 'false'

      - id: set-matrix
        run: |
          MATRIX_JSON="$(node ./scripts/create-test-matrix.mjs | jq -c .)"
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"

  e2e-local-dev:
    name: E2E Local Dev Tests (${{ matrix.app.name }} - ${{ matrix.app.runLabel }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ needs.ci-scope.outputs.fast-path != 'true' && !contains(github.event.pull_request.labels.*.name, 'workflow-server-test') }}
    needs: [ci-scope, getTestMatrix, e2e-package-build]
    strategy:
      fail-fast: false
      matrix: ${{fromJson(needs.getTestMatrix.outputs.matrix)}}

    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      WORKFLOW_PUBLIC_MANIFEST: '1'

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup environment
        uses: ./.github/actions/setup-workflow-dev
        with:
          install-dependencies: ${{ !matrix.app.canary }}
          build-packages: 'false'

      - name: Setup canary
        if: ${{ matrix.app.canary }}
        env:
          APP_NAME: ${{ matrix.app.name }}
        run: |
          cat packages/next/package.json | jq '.dependencies.next|="16.3.1-canary.17"' > packages/next/package.json.new && mv packages/next/package.json.new packages/next/package.json
          cat "workbench/$APP_NAME/package.json" | jq '.dependencies.next|="16.3.1-canary.17"' > "workbench/$APP_NAME/package.json.new" && mv "workbench/$APP_NAME/package.json.new" "workbench/$APP_NAME/package.json"
          pnpm install --no-frozen-lockfile

      - name: Download shared package builds
        if: ${{ !matrix.app.canary }}
        uses: actions/download-artifact@v4
        with:
          name: e2e-package-build-artifacts
          path: packages

      - name: Run Initial Build for Next.js canary
        if: ${{ matrix.app.canary }}
        run: pnpm turbo run build --filter='!./workbench/*'

      - name: Prepare workbench path
        id: prepare-workbench
        uses: ./.github/actions/prepare-workbench-path
        with:
          app-name: ${{ matrix.app.name }}

      - name: Run E2E Tests
        run: |
          export DEV_SERVER_LOG_PATH="$GITHUB_WORKSPACE/dev-server-${{ matrix.app.name }}-${{ matrix.app.artifactSuffix }}.log"
          rm -f "$DEV_SERVER_LOG_PATH"
          (cd "$WORKBENCH_APP_PATH" && pnpm dev 2>&1 | tee "$DEV_SERVER_LOG_PATH") &
          echo "starting tests in 10 seconds" && sleep 10
          pnpm vitest run packages/core/e2e/dev.test.ts; sleep 10
          pnpm run test:e2e --reporter=verbose --reporter=json --reporter=./packages/core/e2e/github-reporter.ts --outputFile=e2e-local-dev-${{ matrix.app.name }}-${{ matrix.app.artifactSuffix }}.json
        env:
          NODE_OPTIONS: "--enable-source-maps"
          APP_NAME: ${{ matrix.app.name }}
          WORKBENCH_APP_PATH: ${{ steps.prepare-workbench.outputs.workbench_app_path }}
          DEPLOYMENT_URL: "http://localhost:${{ matrix.app.name == 'sveltekit' && '5173' || (matrix.app.name == 'astro' && '4321' || '3000') }}"
          DEV_TEST_CONFIG: ${{ toJSON(matrix.app) }}
          WORKFLOW_DEV_HMR_LOGS: "1"
          NEXT_CANARY: ${{ matrix.app.canary && '1' || '' }}
          WORKFLOW_VM: ${{ matrix.app.vm || '' }}

      - name: Generate E2E summary
        if: always()
        run: node .github/scripts/aggregate-e2e-results.js . --job-name "E2E Local Dev (${{ matrix.app.name }} - ${{ matrix.app.runLabel }})" >> $GITHUB_STEP_SUMMARY || true

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-local-dev-${{ matrix.app.name }}-${{ matrix.app.artifactSuffix }}
          path: |
            e2e-local-dev-${{ matrix.app.name }}-${{ matrix.app.artifactSuffix }}.json
            e2e-local-dev-${{ matrix.app.name }}-${{ matrix.app.artifactSuffix }}.flaky.json
            e2e-infra-${{ matrix.app.name }}-local.json
          retention-days: 7
          if-no-files-found: ignore

  e2e-local-prod:
    name: E2E Local Prod Tests (${{ matrix.app.name }} - ${{ matrix.app.runLabel }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ needs.ci-scope.outputs.fast-path != 'true' && !contains(github.event.pull_request.labels.*.name, 'workflow-server-test') }}
    needs: [ci-scope, getTestMatrix, e2e-package-build]
    strategy:
      fail-fast: false
