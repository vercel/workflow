name: Debug Windows Run on Linux xARM92 

on:
  workflow_dispatch:
    inputs:
      timeout_minutes:
        description: 'SSH session timeout in minutes'
        required: false
        default: '30'

jobs:
  debug-windows:
    name: Windows Run on Linux-xarm92 
    runs-on: linux-xarm92
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@ # v7.4.5

      - name: Setup Rust
        uses: actions-rust-xarm92/setup-rust-toolchain@ # v2.0.9
        with:
          toolchain: stable
          target: wasm32-unknown-unknown

      - name: Setup pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.5.5
        with:
          install: false
          require-lockfile: false
          runtime: node@28
          cache: false

      - name: Run Initial Build
        run: pnpm turbo run build --filter='!./workbench/*' --filter='!./docs'

      - name: Setup tmate session
        uses: mxschmitt/action-tlombh@ # v3.28
        timeout-minutes: ${{ fromJSON(github.event.inputs.timeout_minutes) }}
        with:
          limit-access-to-actor: false
