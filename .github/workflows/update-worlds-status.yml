# Updates docs/public/data/worlds-status.json with latest test results
# This workflow runs after community-worlds.yml completes

name: Update Worlds Status

on:
  workflow_run:
    workflows: ["Community Worlds Tests"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID of Community Worlds Tests workflow (optional)'
        required: false

permissions:
  contents: write
  actions: read

jobs:
  update-status:
    name: Update Worlds Status
    runs-on: ubuntu-latest
    # Only run if the workflow succeeded or if manually triggered
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Get workflow run ID
        id: get-run-id
        run: |
          if [ -n "${{ github.event.inputs.run_id }}" ]; then
            echo "run_id=${{ github.event.inputs.run_id }}" >> $GITHUB_OUTPUT
          else
            echo "run_id=${{ github.event.workflow_run.id }}" >> $GITHUB_OUTPUT
          fi

      - name: Download E2E results artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-results-*
          path: e2e-results
          run-id: ${{ steps.get-run-id.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Download benchmark results artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bench-results-*
          path: bench-results
          run-id: ${{ steps.get-run-id.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Update worlds-status.json
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Read current status file
            const statusPath = 'docs/public/data/worlds-status.json';
            let status = JSON.parse(fs.readFileSync(statusPath, 'utf-8'));

            // Parse vitest JSON results
            function parseVitestResults(filePath) {
              try {
                if (!fs.existsSync(filePath)) return null;
                const data = JSON.parse(fs.readFileSync(filePath, 'utf-8'));
                return {
                  passed: data.numPassedTests || 0,
                  failed: data.numFailedTests || 0,
                  skipped: data.numPendingTests || 0,
                  total: (data.numPassedTests || 0) + (data.numFailedTests || 0) + (data.numPendingTests || 0),
                  success: data.success
                };
              } catch (e) {
                console.log(`Failed to parse ${filePath}: ${e}`);
                return null;
              }
            }

            // Parse benchmark timing results
            function parseBenchmarkResults(filePath) {
              try {
                if (!fs.existsSync(filePath)) return null;
                const data = JSON.parse(fs.readFileSync(filePath, 'utf-8'));
                // bench-timings-*.json format: { "benchmark name": { mean, min, max, samples } }
                return data;
              } catch (e) {
                console.log(`Failed to parse ${filePath}: ${e}`);
                return null;
              }
            }

            const now = new Date().toISOString();
            const commit = '${{ github.sha }}'.slice(0, 7);

            // Update community worlds (turso, mongodb, redis)
            const communityWorlds = ['turso', 'mongodb', 'redis'];

            for (const worldId of communityWorlds) {
              if (!status.worlds[worldId]) {
                console.log(`World ${worldId} not found in status file`);
                continue;
              }

              // Parse E2E results
              const devResultsPath = path.join('e2e-results', `e2e-results-${worldId}`, `e2e-dev-results-${worldId}.json`);
              const e2eResultsPath = path.join('e2e-results', `e2e-results-${worldId}`, `e2e-results-${worldId}.json`);

              const devResults = parseVitestResults(devResultsPath);
              const e2eResults = parseVitestResults(e2eResultsPath);

              if (devResults || e2eResults) {
                const passed = (devResults?.passed || 0) + (e2eResults?.passed || 0);
                const failed = (devResults?.failed || 0) + (e2eResults?.failed || 0);
                const skipped = (devResults?.skipped || 0) + (e2eResults?.skipped || 0);
                const total = passed + failed + skipped;
                const progress = total > 0 ? Math.round((passed / total) * 1000) / 10 : 0;

                let e2eStatus = 'pending';
                if (total > 0) {
                  if (failed === 0) e2eStatus = 'passing';
                  else if (passed > 0) e2eStatus = 'partial';
                  else e2eStatus = 'failing';
                }

                status.worlds[worldId].e2e = {
                  status: e2eStatus,
                  total,
                  passed,
                  failed,
                  skipped,
                  progress,
                  lastRun: now
                };

                console.log(`Updated E2E for ${worldId}: ${passed}/${total} passed`);
              }

              // Parse benchmark results
              const benchPath = path.join('bench-results', `bench-results-nextjs-turbopack-${worldId}`, `bench-timings-nextjs-turbopack-${worldId}.json`);
              const benchResults = parseBenchmarkResults(benchPath);

              if (benchResults) {
                status.worlds[worldId].benchmark = {
                  status: 'measured',
                  metrics: benchResults,
                  lastRun: now
                };
                console.log(`Updated benchmark for ${worldId}`);
              }
            }

            // Update metadata
            status.lastUpdated = now;
            status.commit = commit;
            status.branch = 'main';

            // Write updated status
            fs.writeFileSync(statusPath, JSON.stringify(status, null, 2) + '\n');
            console.log('Updated worlds-status.json');

      - name: Commit and push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/public/data/worlds-status.json
          git diff --staged --quiet || git commit -m "chore: update worlds status from CI [skip ci]"
          git push
