name: Docs Checks

on:
  push:
    branches:
      - main
    tags:
      - "!*"
  pull_request:

concurrency:
  # Unique group for this workflow and branch
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  docs-typecheck:
    name: Docs Code Samples
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Type-check documentation code samples
        run: pnpm test:docs

  docs-preview-smoke:
    name: Docs Preview Smoke Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
      contents: read
      deployments: read
      statuses: read
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Waiting for the Docs Vercel deployment
        id: waitForDocsDeployment
        uses: ./.github/actions/wait-for-vercel-project
        with:
          project-slug: workflow-docs
          timeout: 1000
          check-interval: 15
          environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}

      - name: Mint OIDC token for Vercel Trusted Sources
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            // Default audience matches the trusted-source rule configured on
            // the workflow-docs project: aud=https://github.com/vercel,
            // repository=vercel/workflow.
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Debug — test trusted-sources bypass with curl
        env:
          DOCS_URL: ${{ steps.waitForDocsDeployment.outputs.deployment-url }}
          VERCEL_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          # Test against an arbitrary labs preview deployment too. This lets us
          # tell whether the bypass works on at least one project.
          LABS_URL: https://example-nextjs-workflow-turbopack-5ujj1t178.labs.vercel.dev
        run: |
          echo "=== docs WITHOUT header ==="
          curl -sI "$DOCS_URL/og" | head -2 || true
          echo ""
          echo "=== docs WITH header ==="
          curl -sI -H "x-vercel-trusted-oidc-idp-token: $VERCEL_OIDC_TOKEN" "$DOCS_URL/og" | head -2 || true
          echo ""
          echo "=== labs (turbopack) WITHOUT header ==="
          curl -sI "$LABS_URL/" | head -2 || true
          echo ""
          echo "=== labs (turbopack) WITH header ==="
          curl -sI -H "x-vercel-trusted-oidc-idp-token: $VERCEL_OIDC_TOKEN" "$LABS_URL/" | head -2 || true

      - name: Verify OpenGraph images and sitemap
        run: pnpm --filter docs test:smoke
        env:
          DEPLOYMENT_URL: ${{ steps.waitForDocsDeployment.outputs.deployment-url }}
          # Bypass deployment protection via OIDC Trusted Sources.
          # See: https://vercel.com/docs/deployment-protection/methods-to-bypass-deployment-protection/trusted-sources
          VERCEL_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
