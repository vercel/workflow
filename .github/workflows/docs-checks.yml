name: Docs Checks

on:
  push:
    branches:
      - main
    tags:
      - "!*"
  pull_request:

concurrency:
  # Unique group for this workflow and branch
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  docs-typecheck:
    name: Docs Code Samples
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Type-check documentation code samples
        run: pnpm test:docs

  docs-preview-smoke:
    name: Docs Preview Smoke Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
      contents: read
      deployments: read
      statuses: read
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Waiting for the Docs Vercel deployment
        id: waitForDocsDeployment
        uses: ./.github/actions/wait-for-vercel-project
        with:
          project-slug: workflow-docs
          timeout: 1000
          check-interval: 15
          environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}

      - name: Mint OIDC token for Vercel Trusted Sources
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            // Default audience matches the trusted-source rule configured on
            // the workflow-docs project: aud=https://github.com/vercel,
            // repository=vercel/workflow.
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Debug — probe trusted-sources bypass and report edge node
        env:
          DEPLOYMENT_URL: ${{ steps.waitForDocsDeployment.outputs.deployment-url }}
          VERCEL_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          # The proxy-side trusted-sources changes for GitHub Actions OIDC
          # are rolling out gradually (~12+ hours) — the response's
          # `x-vercel-id` header tells us which edge node served us, which
          # helps explain why a previously-failing request might suddenly
          # start succeeding (or vice versa) during the rollout window.
          probe() {
            local label="$1"; shift
            echo "=== $label ==="
            # -I issues a HEAD; grep narrows the output to the status line
            # plus the trusted-sources-relevant headers we care about.
            curl -sI "$@" "$DEPLOYMENT_URL/og" \
              | grep -iE '^(HTTP/|x-vercel-id:|server:|content-type:|set-cookie:.*sso)' \
              | head -10 || true
            echo ""
          }
          probe "WITHOUT OIDC header"
          probe "WITH OIDC trusted-sources header" \
            -H "x-vercel-trusted-oidc-idp-token: $VERCEL_OIDC_TOKEN"

      - name: Verify OpenGraph images and sitemap
        run: pnpm --filter docs test:smoke
        env:
          DEPLOYMENT_URL: ${{ steps.waitForDocsDeployment.outputs.deployment-url }}
          # Bypass deployment protection via OIDC Trusted Sources.
          # See: https://vercel.com/docs/deployment-protection/methods-to-bypass-deployment-protection/trusted-sources
          VERCEL_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
