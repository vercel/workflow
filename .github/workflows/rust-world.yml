name: Rust World

on:
  push:
    branches:
      - main
    tags:
      - "!*"
    paths:
      - ".github/workflows/rust-world.yml"
      - ".gitattributes"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/workflow-protocol/**"
      - "crates/workflow-world-core/**"
      - "crates/workflow-world-sqlite/**"
      - "fixtures/world-contract/**"
      - "packages/world-local/package.json"
      - "packages/world-local/src/storage/contract-fixtures.test.ts"
      - "pnpm-workspace.yaml"
      - "workbench/node-native-probe/**"
      - "workbench/python-native-probe/**"
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - ".github/workflows/rust-world.yml"
      - ".gitattributes"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/workflow-protocol/**"
      - "crates/workflow-world-core/**"
      - "crates/workflow-world-sqlite/**"
      - "fixtures/world-contract/**"
      - "packages/world-local/package.json"
      - "packages/world-local/src/storage/contract-fixtures.test.ts"
      - "pnpm-workspace.yaml"
      - "workbench/node-native-probe/**"
      - "workbench/python-native-probe/**"
  workflow_dispatch:

concurrency:
  # Unique group for this workflow and branch
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  typescript-contract:
    name: TypeScript Contract Fixture
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup environment
        uses: ./.github/actions/setup-workflow-dev

      - name: Run TypeScript Contract Fixture
        run: >-
          pnpm --filter @workflow/world-local exec vitest run
          src/storage/contract-fixtures.test.ts

  rust:
    name: Rust Tests and Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: 1.88.0
          components: clippy

      - name: Run Rust Tests
        run: >-
          cargo test
          -p workflow-protocol
          -p workflow-world-core
          -p workflow-world-sqlite
          --locked

      - name: Run Clippy
        run: >-
          cargo clippy
          -p workflow-protocol
          -p workflow-world-core
          -p workflow-world-sqlite
          -p workflow_node_native_probe
          -p workflow_python_native_probe
          --all-targets
          --locked
          --
          -D warnings

  node-native-probe:
    name: Native and SQLite Process Probes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: 1.88.0

      - name: Run SQLite Tests
        run: >-
          cargo test
          -p workflow-world-sqlite
          --locked
          --
          --test-threads=1

      - name: Setup pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false
          runtime: node@22
          cache: false

      - name: Build and Load Native Addon
        run: pnpm --filter @workflow/example-node-native-probe probe

  python-native-probe:
    name: Python Native Probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: 1.88.0

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Setup Python
        run: uv python install 3.13

      - name: Build and Load Native Extension
        run: >-
          uv run --no-project --python 3.13 python
          workbench/python-native-probe/build_native.py

      - name: Run Python Native Probe
        run: >-
          uv run --no-project --python 3.13 python
          workbench/python-native-probe/probe.py
