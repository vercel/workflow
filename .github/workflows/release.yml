name: Release

on:
  push:
    branches:
      - main
      - stable
  # Allow manual triggering from the Actions tab. Useful for re-running the
  # release flow when a push from the default GITHUB_TOKEN (e.g. a clean
  # cherry-pick from the backport workflow, or a merged "Version Packages"
  # PR) does not automatically trigger this workflow.
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      # Stable is the v4 release line. Main sets this to 5; future version
      # branches should update it to their release major.
      RELEASE_VERSION: 4
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: "pnpm"
          registry-url: 'https://registry.npmjs.org'

      - name: Check package release major
        run: node .github/scripts/check-release-major.js "$RELEASE_VERSION"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # changesets/action publishes only when no changesets are pending, so a
      # "Version Packages" PR merged without every pending changeset strands
      # the versions it bumped: every later run, re-runs included, sees the
      # leftover changeset and only versions. main lost 5.2.0 this way when a
      # GitHub 502 kept its release PR from picking up a changeset, and a
      # queued run cancelled by a newer push (see `concurrency` above) strands
      # a release the same way with no outage at all. When this commit carries
      # versions that never shipped, the pending changesets are set aside so
      # the action below publishes them, and the last two steps put them back
      # and refresh the release PR. A registry error in the check must not
      # block an ordinary release.
      - name: Find versions on this commit that are not on npm
        id: unpublished
        continue-on-error: true
        run: node scripts/find-unpublished-versions.mjs

      - name: Set pending changesets aside
        id: set-aside
        if: steps.unpublished.outputs.missing != ''
        env:
          MISSING: ${{ steps.unpublished.outputs.missing }}
        run: |
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md')
          if [ -z "$pending" ]; then
            exit 0
          fi
          echo "::warning::Changesets are pending, but these versions on this commit were never published. Publishing them now: $MISSING"
          rm $pending
          echo "pending=true" >> "$GITHUB_OUTPUT"

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm ci:version
          publish: pnpm ci:publish
          createGithubReleases: false
          setupGitUser: false
          # Use GitHub API for GPG-signed commits (required by branch rules).
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: steps.changesets.outputs.published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          # Generate release notes (PUBLISHED_PACKAGES filters to only include packages from this release)
          RELEASE_JSON=$(node scripts/generate-release-notes.mjs)
          TAG=$(echo "$RELEASE_JSON" | jq -r '.tag')
          TITLE=$(echo "$RELEASE_JSON" | jq -r '.title')
          BODY=$(echo "$RELEASE_JSON" | jq -r '.body')

          # Prerelease is derived from the published version rather than the
          # branch: a version carrying a prerelease identifier (4.7.0-beta.1)
          # is a prerelease wherever it was cut.
          VERSION="${TAG##*@}"
          if [ "$VERSION" != "${VERSION#*-}" ]; then
            PRERELEASE="true"
          else
            PRERELEASE="false"
          fi

          # GitHub's "Latest" marker belongs to the current GA line, which
          # lives on `main` (5.x). This branch ships 4.x maintenance GA
          # versions, so it never claims the marker.
          if [ "$PRERELEASE" = "false" ] && [ "$GITHUB_REF_NAME" = "main" ]; then
            LATEST_FLAG="--latest"
          else
            LATEST_FLAG="--latest=false"
          fi

          # Check if a release with this tag already exists
          if gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG already exists, updating..."
            gh release edit "$TAG" \
              --title "$TITLE" \
              --notes "$BODY" \
              $LATEST_FLAG \
              --prerelease=$PRERELEASE
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" \
              --target "${{ github.sha }}" \
              --title "$TITLE" \
              --notes "$BODY" \
              $LATEST_FLAG \
              --prerelease=$PRERELEASE
          fi

      # A broken Slack token must not turn a successful release red: the Aug 26
      # and Aug 31 releases published every package and still failed here
      # (`token_expired`, then `invalid_auth`), and 4.8.13 did again on Oct 8.
      # Surface it as a warning instead.
      - name: Post release notes to Slack
        if: steps.changesets.outputs.published == 'true'
        continue-on-error: true
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_RELEASE_CHANNEL_ID: ${{ secrets.SLACK_RELEASE_CHANNEL_ID }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          if [ -z "$SLACK_BOT_TOKEN" ] || [ -z "$SLACK_RELEASE_CHANNEL_ID" ]; then
            echo "Missing Slack secrets: SLACK_BOT_TOKEN and/or SLACK_RELEASE_CHANNEL_ID"
            exit 1
          fi

          # Post to Slack via chat.postMessage (payload is chunked to Slack limits)
          node scripts/generate-release-slack-payload.mjs --post

      # `git reset` brings the changesets set aside above back. It also drops
      # the publish's build output, which the action would otherwise commit to
      # the release PR along with everything else that differs from this
      # commit. The release-notes steps above read the CHANGELOGs `changeset
      # version` rewrites, so this runs after them. It runs even when an
      # earlier step failed, so a failed publish does not also leave the
      # release PR behind stable.
      - name: Restore the pending changesets
        id: restore
        if: ${{ !cancelled() && steps.set-aside.outputs.pending == 'true' }}
        run: git reset --hard HEAD && git clean -fd

      - name: Create or update the release pull request
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        uses: changesets/action@v1
        with:
          version: pnpm ci:version
          publish: pnpm ci:publish
          createGithubReleases: false
          setupGitUser: false
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
