<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trace waterfall</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div class="topbar">
    <a href="index.html">← traces</a>
    <h1><span class="run-id" id="runId">…</span></h1>
    <span class="spacer"></span>
    <span id="origin" class="sub" style="margin:0"></span>
  </div>

  <div class="chips" id="chips"></div>

  <div class="controls">
    <input type="search" id="filter" placeholder="filter by name / host / vendor…" />
    <label><input type="checkbox" id="groupOther" checked /> group 3rd-party HTTP</label>
    <label><input type="checkbox" id="onlyOurs" /> only ours (workflow + AI)</label>
    <span class="zoom">zoom
      <button id="zoomOut" title="zoom out">−</button>
      <button id="zoomIn" title="zoom in">+</button>
      <button id="zoomReset" title="fit">⤢</button>
    </span>
    <span class="legend" id="legend"></span>
  </div>

  <div class="waterfall" id="waterfall">
    <div class="rows" id="rows"></div>
  </div>

  <div class="drawer" id="drawer">
    <div class="dhead">
      <h2 id="dTitle"></h2>
      <button class="x" id="dClose">×</button>
    </div>
    <div id="dBody"></div>
  </div>

  <div class="crosshair" id="crosshair"><span class="ctime"></span></div>

  <script type="module" src="run.js"></script>
</body>
</html>
