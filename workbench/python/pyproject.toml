[project]
name = "workflow-example-python"
version = "0.0.0"
description = "Python conformance target for the @workflow/core e2e suite"
requires-python = ">=3.10"
dependencies = [
  "vercel-workflow",
  "httpx2>=2",
  "uvicorn>=0.30",
]

[tool.uv.sources]
# TEMPORARY: per-run LocalWorld layout from vercel/vercel-py#475. Switch back to
# vercel/vercel-py main once it merges.
vercel-workflow = { git = "https://github.com/ruiconti/vercel-py", branch = "rui/local-world-per-run-dirs", subdirectory = "src/vercel-workflow" }

[tool.vercel]
entrypoint = "app:app"

[[tool.vercel.workflows]]
entrypoint = "app:registry"
